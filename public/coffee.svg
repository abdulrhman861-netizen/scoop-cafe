<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 340"><style>
.scoop-steam path{transform-box:view-box;animation:scoop-steam-rise 4s ease-in-out infinite;will-change:transform,opacity}
.scoop-steam path:nth-child(1){animation-duration:3.8s;animation-delay:-1.2s}
.scoop-steam path:nth-child(2){animation-duration:4.4s;animation-delay:-2.8s}
.scoop-steam path:nth-child(3){animation-duration:4.1s;animation-delay:-.3s}
@keyframes scoop-steam-rise{0%{transform:translate(0,8px);opacity:0}20%{opacity:.8}65%{opacity:.5}100%{transform:translate(-5px,-16px);opacity:0}}
@media(prefers-reduced-motion:reduce){.scoop-steam path{animation:none;opacity:.7}}
