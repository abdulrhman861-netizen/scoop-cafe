<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>سكوب كوفي | SCOOP Cafe</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 text-right font-sans">
  <div id="app" class="max-w-md mx-auto min-h-screen pb-20">
    <!-- Header -->
    <div class="bg-amber-900 text-white p-4 shadow-md flex justify-between items-center rounded-b-2xl">
      <div>
        <h1 class="text-xl font-bold">سكوب كوفي | SCOOP Cafe</h1>
        <p class="text-xs text-amber-200">الجامعة العراقية - مجمع سبع أبكار</p>
      </div>
      <a href="https://instagram.com" target="_blank" class="text-xs bg-amber-800 px-3 py-1 rounded-full border border-amber-700">📸 إنستغرام</a>
    </div>

    <!-- Main Content Grid -->
    <div className="p-4" id="products-list">
      <p class="text-center text-gray-500 my-10">جاري تحميل المنيو...</p>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://uhdwrmfylbqqakwxznds.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVoZHdybWZ5bGJxcWFrd3h6bmRzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Mzg5MjE1ODIsImV4cCI6MjA1NDQ5NzU4Mn0.XXXXX'; // استكمل المفتاح المنسوخ
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function loadProducts() {
      const { data: products } = await supabase.from('products').select('*');
      const container = document.getElementById('products-list');
      if (!products || products.length === 0) {
        container.innerHTML = '<p class="text-center text-gray-500 my-10">لا توجد منتجات حالياً.</p>';
        return;
      }
      container.innerHTML = products.map(p => `
        <div class="bg-white p-3 rounded-xl shadow-sm border mb-3 flex gap-3 items-center">
          <img src="${p.image_url}" class="w-20 h-20 object-cover rounded-lg" />
          <div>
            <h3 class="font-bold text-gray-800">${p.name}</h3>
            <p class="text-amber-800 font-bold text-sm mt-1">${p.price} د.ع</p>
          </div>
        </div>
      `).join('');
    }
    loadProducts();
  </script>
</body>
</html>
